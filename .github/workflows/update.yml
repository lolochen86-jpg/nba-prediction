name: 更新 NBA 預測網站

on:
  schedule:
    # 台灣時間 07:00 / 14:00 / 21:00（= UTC 23:00 / 06:00 / 13:00）
    - cron: "0 23,6,13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nba-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'fccf86dabdc8bdbd5770ad7fcdb14b7d' }}
      CF_PROJECT: nba-prediction-00
      NBA_CACHE: ${{ github.event_name == 'workflow_dispatch' && format('/home/runner/nba-manual-{0}', github.run_id) || '/home/runner/nba-cache' }}
    steps:
      - uses: actions/checkout@v4

      - name: 檢查部署設定
        run: |
          python - <<'PY'
          import os, re
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "").strip()
          if not token:
              raise SystemExit("::error::Set CLOUDFLARE_API_TOKEN in repository Settings > Secrets and variables > Actions.")
          if not re.fullmatch(r"[A-Za-z0-9_-]+", token):
              raise SystemExit("::error::CLOUDFLARE_API_TOKEN must contain only the token value on one line, without commands, quotes or internal line breaks. Edit this repository secret and paste the token value only.")
          print("::add-mask::" + token)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("CLOUDFLARE_API_TOKEN=" + token + "\n")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝依賴
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 快取資料源回應
        uses: actions/cache@v4
        with:
          path: ~/nba-cache
          key: nba-cache-${{ github.run_id }}
          restore-keys: nba-cache-

      - name: 抓資料 → 跑模型 → 產生網站
        run: python -m pipeline.build

      - name: 檢查中英文與驗證邏輯
        run: python -m unittest discover -s tests -v

      - name: 驗證新人榜與中英文頁面
        run: python -m pipeline.validate

      - name: 部署到 Cloudflare Pages
        run: npx --yes wrangler@latest pages deploy site --project-name "$CF_PROJECT" --branch main --commit-dirty=true

      - name: 驗證正式站資料
        run: python tools/verify_production.py

      - name: 提交預測快照與網站（回測用）
        run: |
          git config user.name "nba-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site data
          if git diff --staged --quiet; then
            echo "沒有變更"
          else
            git commit -m "chore: 更新預測 $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
            git push
          fi
